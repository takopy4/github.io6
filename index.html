<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Калькулятор стоимости товара</title>
    <script src="calc.js" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }
        [hidden] {
            display: none !important;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 16px;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            color: #e5e7eb;
            background: linear-gradient(135deg, #0f172a 0%, #312e81 50%, #0f172a 100%);
        }
        footer {
            color: #94a3b8;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
        }
        .card {
            width: 100%;
            max-width: 460px;
            padding: 32px 28px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0 0 6px;
            font-size: 26px;
            text-align: center;
            color: #f8fafc;
        }
        .subtitle {
            margin: 0 0 24px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            border: none;
            margin: 0;
            padding: 0;
        }
        legend {
            padding: 0;
            margin-bottom: 6px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            font-size: 16px;
            font-family: inherit;
            color: #f1f5f9;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        option {
            background: #0f172a;
            color: #f1f5f9;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.25);
        }
        .choice {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
            font-weight: 500;
            cursor: pointer;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            transition: border-color 0.2s, background 0.2s;
        }
        .choice:hover {
            border-color: #818cf8;
        }
        .choice:has(input:checked) {
            background: #1e1b4b;
            border-color: #818cf8;
        }
        .choice input {
            width: 18px;
            height: 18px;
            accent-color: #818cf8;
        }
        #result {
            margin-top: 22px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            color: #6ee7b7;
            background: #064e3b;
            border: 1px solid #10b981;
            border-radius: 12px;
        }
        #result.error {
            font-size: 15px;
            color: #fca5a5;
            background: #7f1d1d;
            border-color: #ef4444;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Калькулятор заказа</h1>
        <p class="subtitle">Стоимость пересчитывается автоматически</p>
        <form id="calc-form">
            <div class="field">
                <label for="quantity">Количество</label>
                <input type="text" id="quantity" value="1" autocomplete="off">
            </div>

            <fieldset class="field">
                <legend>Товар</legend>
                <label class="choice">
                    <input type="radio" name="product" value="keyboard" checked>
                    Клавиатура — 990 ₽
                </label>
                <label class="choice">
                    <input type="radio" name="product" value="headphones">
                    Наушники — 2490 ₽
                </label>
                <label class="choice">
                    <input type="radio" name="product" value="monitor">
                    Монитор — 15900 ₽
                </label>
            </fieldset>

            <div class="field" id="option-group" hidden>
                <label for="option">Модель наушников</label>
                <select id="option">
                    <option value="0">Проводные — +0 ₽</option>
                    <option value="1500">Беспроводные — +1500 ₽</option>
                    <option value="4000">С шумоподавлением — +4000 ₽</option>
                </select>
            </div>

            <div class="field" id="property-group" hidden>
                <label class="choice">
                    <input type="checkbox" id="property">
                    Расширенная гарантия 2 года — +1990 ₽
                </label>
            </div>
        </form>
        <div id="result" aria-live="polite"></div>
    </main>
    <footer>Губанов Кирилл</footer>
</body>
</html>
